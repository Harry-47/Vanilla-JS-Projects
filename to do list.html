<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: grey;
            position: relative;
        }
        .card {
            margin-top: 100px;
            margin-left: 440px;
            width: 25%;
            padding: 20px;
            background-color: aliceblue;
            border-radius: 25px;
            height: 55vh;
            position: relative;
            overflow-x: auto;
        }
        h3 {
            text-align: center;
            margin-top: 5px;
            margin-right: 30px;
        }
        ul > li {
            width: 80%;
            list-style-type: none;
            display: block;
        }
        ul > li:hover {
            background-color: lightblue;
            box-shadow: 3px 3px 10px;
            transition: box-shadow 100ms;
        }
        .note {
            margin-left: 10px;
            border-radius: 15px;
            width: 70%;
            display: none;
            font-family: sans-serif;
            font-weight: 600;
        }
        button {
            margin-left: 10px;
            padding: 8px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: sticky;
            top: 10px;
        }
        .del {
            position: absolute;
            top: 22px;
            right: 10px;
            display: none;
        }
        .add {
            position: absolute;
            top: 22px;
            left: 10px;
            width: 30px;
        }
        .done {
            display: none;
            position: absolute;
            top: 290px;
            left: 10px;
            width: 70px;
        }
        textarea::placeholder {
            padding-left: 5px;
        }
        .itemstyle {
            background-color: lightgray;
            height: 50px;
            width: 220px;
            border: 1px solid lightgrey;
            border-radius: 10px;
            margin-top: 5px;
            padding-left: 5px;
            cursor: pointer;
            overflow:hidden;
        }
        .forfirst {
            margin-top: 20px;
        }
        .selected {
            background-color: red;
            height: fit-content;
            min-width: 220px;  
        }
        .updated {
            min-width: 220px;
            min-height: fit-content;
        }

        #update {
         position: absolute;
         top: 300px;
         right: 10px;
         display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>To-Do List</h3>
        <ul>
            <!-- Your todo items will be dynamically added here -->
            <textarea rows="3" cols="20" name="note" class="note" placeholder="Your Text Here..."></textarea>
        </ul>
        <button class="add">+</button>
        <button class="del">Delete Note</button>
        <button class="done">Done</button>
        <button id="update">Update</button>
    </div>
    <script>
        const addBtn = document.querySelector('.add');
        const delBtn = document.querySelector('.del');
        const doneBtn = document.querySelector('.done');
        const noteInput = document.querySelector('.note');
        const list = document.querySelector('ul');
        let selectedLi = null;
        const updateBtn = document.querySelector('#update');

        addBtn.addEventListener('click', () => {
            noteInput.style.display = 'block';
            noteInput.value = '';
            doneBtn.style.display = 'inline';
            selectedLi = null;
        });

        doneBtn.addEventListener('click', () => {
            if (noteInput.value !== '') {
                if (selectedLi) {
                    selectedLi.innerText = noteInput.value;
                    selectedLi.classList.add('updated');
                    selectedLi.classList.remove('selected');
                } else {
                    const li = document.createElement('li');
                    li.classList.add('itemstyle');
                    li.innerText = noteInput.value;
                    list.appendChild(li);

                    li.addEventListener('click', () => {
                        if (li.classList.contains('selected')) {
                            li.classList.remove('selected');
                            selectedLi = null;
                            delBtn.style.display = 'none';
                            doneBtn.style.display = 'none';
                            noteInput.style.display = 'none';
                        } else {
                            // if (selectedLi) {
                            //     selectedLi.classList.remove('selected');
                            // }
                            li.classList.add('selected');
                            selectedLi = li;
                            noteInput.value = li.innerText;
                            noteInput.style.display = 'block';
                            doneBtn.style.display = 'inline';
                            delBtn.style.display = 'inline';
                        }
                    });
                }
                noteInput.style.display = 'none';
                doneBtn.style.display = 'none';
                noteInput.value = '';
                selectedLi = null;
                delBtn.style.display = 'none';
            }
        });

        delBtn.addEventListener('click', () => {
            if (selectedLi) {
                list.removeChild(selectedLi);
                selectedLi = null;
                delBtn.style.display = 'none';
                doneBtn.style.display = 'none';
                noteInput.style.display = 'none';
            }
        });

    </script>
</body>
</html>
