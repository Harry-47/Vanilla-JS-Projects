<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Generate a <span class="highlight">Random password</span></h1>
        <div class="password-container">
            <input type="text" id="password" disabled>
            <input type="number" id="length">
            <button class="copy-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13 1H3a1 1 0 0 0-1 1v12.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 2.5A1.5 1.5 0 0 1 3.5 1H13a1 1 0 0 1 1 1v12.5a1 1 0 0 1-1 1H3.5A1.5 1.5 0 0 1 2 13.5V2.5z"/>
                    <path d="M4 4h8v2H4V4zm0 3h8v2H4V7zm0 3h8v2H4v-2z"/>
                </svg>
            </button>
        </div>
        <div class="selections">
            <div class="uppercase">
                <input type="checkbox" name="Uppercase" id="uppercase">
                <span>Uppercase Letters</span>
            </div>
            <div class="symbols">
                <input type="checkbox" name="symbols" id="symbols">
                <span>Special Characters</span>
            </div>
            <div class="numbers">
                <input type="checkbox" name="numbers" id="numbers">
                <span>Numbers</span>
            </div>

            <div class="lowercase">
                <input type="checkbox" name="lowecase" id="lowercase">
                <span>Lowercase Letters</span>
            </div>
            
            
        </div>
        <button class="generate-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 16 16">
                <path d="M4 4.5C4 3.67 4.67 3 5.5 3h5c.83 0 1.5.67 1.5 1.5V5h1V4.5a2.5 2.5 0 0 0-2.5-2.5h-5A2.5 2.5 0 0 0 3 4.5v7A2.5 2.5 0 0 0 5.5 14H9v-1H5.5A1.5 1.5 0 0 1 4 11.5V4.5zM12.5 6a.5.5 0 0 0-.5.5v2.79l-1.15-1.15a.5.5 0 1 0-.7.7l2 2a.5.5 0 0 0 .7 0l2-2a.5.5 0 0 0-.7-.7L13 9.29V6.5a.5.5 0 0 0-.5-.5z"/>
            </svg>
            Generate Password
        </button>
    </div>
    <script src="logic.js"></script>
</body>
</html>
