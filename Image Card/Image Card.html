<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .main{
         border: 2px solid lightgray;
         height: 30vhpx;
         width: 250px;
         margin: auto;
         margin-top: 150px;
         border-radius: 26px;
         box-sizing: border-box;   
       }
       img{
        height: 200px;
        width: 90%;
        border-radius: 25px;
        margin-top: 10px;
        margin-left: 12px;
       }
       .child1{
         height: 40%;
         border-radius: 25px;
         /* border: 2px solid red; */
       }
       .child2{
         height: 10%;
         border-radius: 25px;
         /* border: 2px solid green; */
         text-align: left;
       }
       .child2>span{
        margin-left: 15px;
       }
       span{
         border:1px solid lightgray;
         border-radius: 15px;

       }
       .child3{
         height: 46%;
         border-radius: 25px;
         /* border: 2px solid blue; */
         text-align: center;
       }
    </style>
</head>
<body>
<div class="main">
  <div class="child1">
    <img src="pexels-olly-3777557.jpg" alt="image loading">
  </div>
  <div class="child2">
    <span>Business</span>
    <span>Life</span>
  </div>
  <div class="child3">
    <h> <strong>Lorem, ipsum dolor.</strong></h>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Tempore dolorem vel quis qui nisi beatae dignissimos. Ratione reprehenderit consectetur animi.</p>
  </div>
</div>
    
</body>
</html>
