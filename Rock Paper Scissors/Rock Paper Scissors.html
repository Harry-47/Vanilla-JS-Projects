<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif, Geneva, Tahoma, sans-serif;
            font-weight: 600;
            color: white;
        }

        header {
            background-color: rgb(0, 255, 72);
            color: #fff;
            text-align: center;
            font-size: 24px;
            margin: auto;
            width: 100%;
            height: 55px;
            padding-top: 8px;
            border-radius: 25px;
            margin-top: 5px;
        }

        img {
            border: 2px solid red;
            height: 100px;
            width: 100px;
            border-radius: 50px;
            margin-left: 10px;
            cursor: pointer;
        }

        img:hover {
            border: 2px solid blue;
            transform: scale(1.1);
            box-shadow: 5px 5px 5px black;
            transition: transform 0.5s ease;
        }

        .images {
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid black;
            margin-top: 30px;
            gap: 30px;

        }

        #rock {
            margin-left: 450px;
        }

        .scores {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            gap: 150px;
        }

        .win {
            background-color: green;
        }

        .lose {
            background-color: red;
        }

        button {
            margin-left: 550px;
            margin-top: 30px;
            ;
            background-color: red;
            border-radius: 10px;
            color: white;
            height: 35px;
            min-width: 200px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body bgcolor="black">

    <header>Rock Papper Scissors Game</header>
    <div class="images">
        <img id="rock" src="rock.png" alt="">
        <img id="paper" src="paper.png" alt="">
        <img id="scissors" src="scissors.png" alt="">

    </div>
    <div class="scores">
        <h3>
            <p>0</p>
            Your Score
        </h3>
        <h3>
            <p>0</p>
            Computer Score
        </h3>
    </div>
    <button class="btn">Select You Choice</button>
    <script>
        const btn = document.querySelector(".btn");
        const images = document.querySelectorAll("img");
        const scores = document.querySelectorAll("p");
        let computerScore = 0;
        let userScore = 0;
        let userChoice = "";
        let computerChoice = "";
        let winner = "";

        //function to decide winner
        function decideWinner(userChoice, computerChoice) {
            if (userChoice === computerChoice) {
                return "tie";
            }
            else if ((userChoice === "rock" && computerChoice === "scissors") || (userChoice === "scissors" && computerChoice === "paper") || (userChoice === "paper" && computerChoice === "rock")) {
                return "win";
            }
            else {
                return "lose";
            }
        }
        //function to decide the points
        function decidePoints(Winner) {
            if (Winner === "win") {
                userScore++;
                scores[0].textContent = userScore;
            }
            else if (Winner === "lose") {
                computerScore++;
                scores[1].textContent = computerScore;
            }
        }

        images.forEach((img) => {
            img.addEventListener("click", function () {
                let randomNumber = Math.floor(Math.random() * 3);
                userChoice = img.getAttribute("id");
                computerChoice = images[randomNumber].getAttribute("id");
                winner = decideWinner(userChoice, computerChoice);

                if (winner === "win") {
                    btn.classList.add("win");
                    btn.classList.remove("lose");
                    btn.textContent = `You Win! ${userChoice} beats ${computerChoice}`;
                    decidePoints(winner);
                }
                else if (winner === "lose") {
                    btn.classList.add("lose");
                    btn.classList.remove("win");
                    btn.textContent = `You Lose! ${computerChoice} beats ${userChoice}`;
                    decidePoints(winner);
                }
                else {
                    btn.classList.remove("win", "lose");
                    btn.textContent = "It's a Tie!";
                    //  decidePoints(winner);
                }

            })
        });

    </script>
</body>

</html>
